<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Итоги Resource Battle" />
    <title>Resource Battle — Итоги</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="header-logos">
          <div class="logo-main">
            <img src="/media/main-logo" alt="Логотип" class="main-logo-img" onerror="this.style.display='none'" />
          </div>
          <div class="logo-partner">
            <img src="/media/partner-logo" alt="Логотип партнёра" class="partner-logo-img" onerror="this.style.display='none'" />
          </div>
          <div class="logo-partner3">
            <img src="/media/partner3-logo" alt="Логотип партнёра 3" class="partner-logo-img" onerror="this.style.display='none'" />
          </div>
        </div>
      </header>

      <section class="card results-card">
        <div class="results-hero">
          <!-- Verdict text -->
          <div class="results-verdict">
            <div class="verdict-text">{{.Description}}</div>
          </div>

          <!-- Full-width result image -->
          <div class="results-image">
            <img src="/static/results/{{.ImageName}}" alt="Результат" class="result-full-image" onerror="this.style.display='none'" />
          </div>

          <!-- QR codes full width -->
          {{if .QRCodes}}
          <div class="results-qrcodes">
            <div class="kicker" style="margin-bottom: 12px;">QR-коды</div>
            <div class="qr-grid">
              {{range .QRCodes}}
              <div class="qr-item">
                <img src="/media/qr/{{.ID}}" alt="{{.Title}}" class="qr-img" />
                <div class="team-name" style="margin-top:8px;">{{.Title}}</div>
                {{if .Description}}<div class="muted" style="margin-top:4px;">{{.Description}}</div>{{end}}
              </div>
              {{end}}
            </div>
          </div>
          {{end}}
        </div>
      </section>

      <footer class="results-footer">
        <div class="results-footer-menu">
          {{template "_menu.html"}}
          <a href="/" class="btn">← На главную</a>
        </div>
        <div class="muted">Resource Battle — командная IT-игра</div>
      </footer>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
