<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resource Battle — Выбор команды</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="header-top">
          <div>
            <div class="kicker">Resource Battle</div>
            <h1 class="title">Подача результатов</h1>
          </div>
        </div>
        <div class="header-logos">
          <div class="logo-main">
            <img src="/media/main-logo" alt="Логотип" class="main-logo-img" onerror="this.style.display='none'" />
          </div>
          <div class="logo-partner">
            <img src="/media/partner-logo" alt="Логотип партнёра" class="partner-logo-img" />
          </div>
          <div class="logo-partner3">
            <img src="/media/partner3-logo" alt="Логотип партнёра 3" class="partner-logo-img" onerror="this.style.display='none'" />
          </div>
        </div>
      </header>

      <section class="card">
        <div style="padding: 14px 14px 10px; border-bottom: 1px solid var(--card-border-bottom);">
          <div class="kicker">Выберите вашу команду</div>
        </div>
        <div style="padding: 20px 14px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center;">
          {{range .Teams}}
          <a href="/submit/{{.ID}}" class="btn" style="padding: 16px 24px; font-size:1.1em; text-decoration:none; display:block; text-align:center; min-width: 160px;">
            <div style="font-weight:700;">{{.Name}}</div>
          </a>
          {{end}}
        </div>
      </section>

      <footer class="footer">
        <div class="muted" style="text-align:center;">
          <a href="/" class="link">← Вернуться к лидерборду</a>
        </div>
      </footer>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
